    /* 有选区时返回相交的完整行；无选区时返回全文。
       选区终点刚好跨过换行符时，不把下一行错误包含进来。 */
    function affectedLines(value, start, end) {
      if (start === end) return [0, value.length];
      var first = value.lastIndexOf('\n', Math.max(0, start - 1)) + 1;
      var endProbe = end;
      if (end > start && value.charAt(end - 1) === '\n') endProbe = end - 1;
      var nextBreak = value.indexOf('\n', endProbe);
      return [first, nextBreak < 0 ? value.length : nextBreak];
    }

    /* 每一行分别记录改动，再将原选区端点映射至新文本。
       纯空行不追加空格；反缩进每行最多删除 step 个普通前导空格。 */
    function changeIndent(add, step) {
      var value = A.value;
      var originalStart = A.selectionStart;
      var originalEnd = A.selectionEnd;
      // 赋回 textarea.value 会让移动浏览器重置/自动调整滚动位置；先记住视口，稍后恢复。
      var previousScrollTop = A.scrollTop;
      var previousScrollLeft = A.scrollLeft;
      var range = affectedLines(value, originalStart, originalEnd);
      var blockStart = range[0];
      var blockEnd = range[1];
      var oldBlock = value.slice(blockStart, blockEnd);
      var oldLines = oldBlock.split('\n');
      var rows = oldLines.map(function (line) {
        var remove = 0;
        var next = line;
        if (add) {
          if (line.trim() !== '') next = ' '.repeat(step) + line;
        } else {
          remove = Math.min(step, (line.match(/^ */) || [''])[0].length);
          next = line.slice(remove);
        }
        return {
          old: line,
          next: next,
          inserted: add && line.trim() !== '' ? step : 0,
          removed: remove
        };
      });
      var newBlock = rows.map(function (row) { return row.next; }).join('\n');
      var newValue = value.slice(0, blockStart) + newBlock + value.slice(blockEnd);
      var delta = newBlock.length - oldBlock.length;

      function mapPosition(position) {
        if (position < blockStart) return position;
        if (position > blockEnd) return position + delta;
        var oldCursor = 0;
        var newCursor = 0;
        for (var index = 0; index < rows.length; index++) {
          var row = rows[index];
          var oldLength = row.old.length;
          if (position - blockStart <= oldCursor + oldLength) {
            var offset = position - blockStart - oldCursor;
            var mappedOffset = row.inserted ? offset + row.inserted : Math.max(0, offset - row.removed);
            return blockStart + newCursor + mappedOffset;
          }
          oldCursor += oldLength + 1;
          newCursor += row.next.length + 1;
        }
        return blockStart + newBlock.length;
      }

      var newStart = mapPosition(originalStart);
      var newEnd = mapPosition(originalEnd);
      A.value = newValue;
      // 不抢焦点，避免工具按钮唤起软键盘；主按钮的 pointerdown 会保留原 textarea 焦点和可见选区。
      A.setSelectionRange(Math.max(0, newStart), Math.max(0, newEnd));
      // wrap=off 使逻辑行不再被折成“第二视觉行”；恢复原滚动视口，避免浏览器把文字自动拉回固定位置。
      A.scrollTop = previousScrollTop;
      A.scrollLeft = previousScrollLeft;
      count();
    }

    function updateStep(kind, step) {

      P.querySelectorAll('[data-menu="' + kind + '"] button').forEach(function (button) {

    function normalizeExtension(raw) {

      return String(raw || '')
        .trim()
        .replace(/^\.+/, '')
        .replace(/[^A-Za-z0-9._-]/g, '')
        .replace(/\.{2,}/g, '.')
        .replace(/\.$/, '')
        .slice(0, 20)
        .toLowerCase();
    }

    function updateExportExtension(raw) {

    /*

       工具操作前将 inputmode 设为 none 且暂时设为 readonly：选区可见、脚本仍能改值，
       但页面不再请求软键盘。用户亲自点回编辑区时会在默认聚焦动作前恢复可编辑状态。
    */
    function setEditorKeyboardMode(allowTextInput) {
      A.setAttribute('inputmode', allowTextInput ? 'text' : 'none');

      if (!allowTextInput && W.navigator.virtualKeyboard && typeof W.navigator.virtualKeyboard.hide === 'function') {

    function flashButton(button, message, duration) {

      var labelTarget = button.querySelector('[data-feedback-label]') || button;
      var normal = button.dataset.normalLabel || labelTarget.textContent;
      button.dataset.normalLabel = normal;
      W.clearTimeout(button._zmfFeedbackTimer);
      labelTarget.textContent = message;
      button.classList.add('is-feedback');

    /* 中央按钮也在 pointerdown 立即执行，避免移动端等待松手后的 click 才有反应。
       同时阻止其夺走 textarea 焦点，确保选区、软键盘抑制策略与缩进按钮完全一致。 */
    function installInstantAction(button, action) {
      var suppressClickUntil = 0;
      function runAction() {
        setEditorKeyboardMode(false);
        closeMenus();
        action();
      }
      button.addEventListener('pointerdown', function (event) {
        if (event.isPrimary === false || (event.pointerType === 'mouse' && event.button !== 0)) return;
        event.preventDefault();
        suppressClickUntil = Date.now() + 750;
        runAction();
      });
      button.addEventListener('mousedown', function (event) { event.preventDefault(); });
      button.addEventListener('click', function (event) {
        if (event.detail !== 0 && Date.now() < suppressClickUntil) {
          event.preventDefault();
          return;
        }
        runAction();
      });
    }

    /*
       先前通过 click 执行：触屏浏览器通常要等手指抬起才派发 click，视觉上会显得滞后。
       这里改在 pointerdown 立即执行，并在按住 360ms 后每 85ms 连续执行。
       阻止按钮取得焦点，textarea 仍保有焦点/可见选区，因此既不丢选区，也不会由脚本重新唤起软键盘。
    */
    function installRepeatAction(button, add) {
      var isDown = false;
      var holdTimer = 0;
      var repeatTimer = 0;
      var suppressClickUntil = 0;

      function runOnce() {
        // 只在工具动作期间关闭虚拟键盘请求；不改变 textarea 的焦点或已建立选区。
        setEditorKeyboardMode(false);
        closeMenus();
        changeIndent(add, add ? inStep : outStep);
      }
      function stopRepeating(event) {
        if (!isDown) return;
        isDown = false;
        W.clearTimeout(holdTimer);
        W.clearInterval(repeatTimer);
        // 同一次触摸/鼠标操作后仍可能补发 click；忽略它，避免多执行一次。
        suppressClickUntil = Date.now() + 750;
        if (event && button.releasePointerCapture && button.hasPointerCapture && button.hasPointerCapture(event.pointerId)) {
          button.releasePointerCapture(event.pointerId);
        }
      }

      // Android 的长按文字选择/系统菜单会触发 pointercancel，从而中止定时器；明确禁用这些按钮上的原生文字手势。
      ['selectstart', 'dragstart', 'contextmenu'].forEach(function (eventName) {
        button.addEventListener(eventName, function (event) { event.preventDefault(); });
      });
      button.addEventListener('pointerdown', function (event) {
        if (event.isPrimary === false || (event.pointerType === 'mouse' && event.button !== 0)) return;
        if (isDown) return;
        event.preventDefault();
        isDown = true;
        if (button.setPointerCapture) button.setPointerCapture(event.pointerId);
        runOnce(); // 按下即响应，而不是等 click / 松手。
        holdTimer = W.setTimeout(function () {
          if (!isDown) return;
          repeatTimer = W.setInterval(runOnce, 85);
        }, 360);
      });
      // 某些桌面 Chromium 会在 pointerdown 后补发 mousedown；再次阻止其默认聚焦行为。
      button.addEventListener('mousedown', function (event) { event.preventDefault(); });
      button.addEventListener('pointerup', stopRepeating);
      button.addEventListener('pointercancel', stopRepeating);
      button.addEventListener('lostpointercapture', stopRepeating);
      button.addEventListener('click', function (event) {
        // pointer 操作已经在 pointerdown 完成；保留此分支供键盘 Enter/Space 访问。
        if (event.detail !== 0 && Date.now() < suppressClickUntil) {
          event.preventDefault();
          return;
        }
        runOnce();
      });
    }
    installRepeatAction(P.querySelector('[data-k="in"]'), true);
    installRepeatAction(P.querySelector('[data-k="out"]'), false);

    P.querySelector('[data-m="in"]').onclick = function (event) {
      toggleMenu('in', event);
    };
    P.querySelector('[data-m="out"]').onclick = function (event) {
      toggleMenu('out', event);
    };
    exportDropButton.onclick = function (event) {
      toggleMenu('ext', event);
    };
    // 这个箭头嵌在“清理围栏”主按钮内，须阻止事件冒泡，避免点箭头同时执行清理。
    cleanDropButton.addEventListener('pointerdown', function (event) {
      event.preventDefault();
      event.stopPropagation();
    });
    cleanDropButton.addEventListener('mousedown', function (event) {
      event.preventDefault();
      event.stopPropagation();
    });
    cleanDropButton.onclick = function (event) {
      event.preventDefault();
      toggleMenu('clean', event);
    };
    cleanDropButton.onkeydown = function (event) {

        toggleMenu('clean', event);
      }
    };
    P.querySelectorAll('[data-menu="clean"] button[data-clean-mode]').forEach(function (button) {
      button.onclick = function (event) {
        event.stopPropagation();
        updateCleanMode(button.dataset.cleanMode);
        closeMenus();
      };
    });
    P.querySelectorAll('[data-menu="ext"] button[data-ext]').forEach(function (button) {
      button.onclick = function (event) {
        event.stopPropagation();
        updateExportExtension(button.dataset.ext);
        customExtInput.value = '';
        closeMenus();
      };
    });
    function confirmCustomExtension(event) {

        customExtInput.blur();
        setEditorKeyboardMode(false);

    customExtButton.onclick = confirmCustomExtension;
    customExtInput.addEventListener('keydown', function (event) {

    ['in', 'out'].forEach(function (kind) {
      P.querySelectorAll('[data-menu="' + kind + '"] button').forEach(function (button) {
        button.onclick = function (event) {
          event.stopPropagation();

    });
    D.addEventListener('click', closeOnOutside);
    D.addEventListener('keydown', closeOnEscape);
    updateStep('in', inStep);
    updateStep('out', outStep);
    updateExportExtension(exportExtension);
    updateCleanMode(cleanMode);

    H.onpointerdown = function (event) {
      if (event.target === X || event.target.closest('.x')) return;
      dragging = true;
      startX = event.clientX;
      startY = event.clientY;
      var rect = P.getBoundingClientRect();
      oldLeft = rect.left;
      oldTop = rect.top;
      P.style.left = oldLeft + 'px';
      P.style.top = oldTop + 'px';
      if (H.setPointerCapture) H.setPointerCapture(event.pointerId);
      event.preventDefault();
    };
    H.onpointermove = function (event) {

      P.style.top = Math.max(0, Math.min(oldTop + event.clientY - startY, W.innerHeight - P.offsetHeight)) + 'px';
    };

      dragging = false;
      if (event && H.releasePointerCapture && H.hasPointerCapture && H.hasPointerCapture(event.pointerId)) {

      }

    H.onpointerup = stopDrag;
    H.onpointercancel = stopDrag;

      P.style.left = Math.max(0, Math.min(rect.left, W.innerWidth - P.offsetWidth)) + 'px';
      P.style.top = Math.max(0, Math.min(rect.top, W.innerHeight - P.offsetHeight)) + 'px';

    };

    P._zmfDispose = destroy;

    function convertMarkdownToPlainText() {
      if (!A.value) {
        flashButton(plainTextButton, '无内容');
        return;
      }

      /*
         基于提供书签的转换顺序：先保护不应继续解析的片段，再依次去掉 Markdown 标记。
         表格原样保留，代码块/行内代码只去围栏或反引号，内部字符不再被粗体、链接等规则误改。
      */
      var stored = [];
      function store(value) {
        var index = stored.length;
        stored.push(value);
        return '\u0000ZMF' + index + '\u0000';
      }
      var value = A.value.replace(/\r\n?/g, '\n');

      // 先取出三反引号和波浪线代码块，并只移除其最外层围栏和语言声明。
      value = value.replace(/^[ \t]*(`{3,}|~{3,})[^\n]*\n([\s\S]*?)^[ \t]*\1[ \t]*$/gm, function (match, fence, code) {
        return store(code.replace(/\n$/, ''));
      });
      // 沿用参考书签的原则：含竖线的连续表格行原样保留，避免表格结构被链接/强调规则打散。
      value = value.replace(/(?:^[^\n]*\|[^\n]*(?:\n|$))+/gm, function (table) {
        return store(table.replace(/\n$/, '')) + '\n';
      });
      // 行内代码原样保留内容，仅移除单反引号。
      value = value.replace(/`([^`\n]+)`/g, function (match, code) {
        return store(code);
      });

      value = value
        .replace(/!\[([^\]]*)\]\((?:\\.|[^)])*\)/g, '$1')       // 图片保留替代文本
        .replace(/\[([^\]\n]+)\]\((?:\\.|[^)\n])*\)/g, '$1') // 行内链接保留标题
        .replace(/\[([^\]\n]+)\]\[[^\]\n]*\]/g, '$1')         // 引用式链接保留标题
        .replace(/^\s*\[[^\]\n]+\]:\s*\S+.*$/gm, '')            // 移除引用式链接的地址定义
        .replace(/(\*\*|__)([\s\S]*?)\1/g, '$2')                // 粗体
        .replace(/(\*|_)([^*_\n]+)\1/g, '$2')                    // 斜体
        .replace(/~~([\s\S]*?)~~/g, '$1')                         // 删除线
        .replace(/^#{1,6}[ \t]+(.+?)[ \t]*#*[ \t]*$/gm, '$1')    // ATX 标题
        .replace(/^[ \t]*(?:=+|-+)[ \t]*$/gm, '')                 // Setext 标题下划线 / 分隔线
        .replace(/^[ \t]*>[ \t]?/gm, '')                          // 引用块符号
        .replace(/^([ \t]*)[-*+][ \t]+(?:\[[ xX]\][ \t]*)?/gm, '$1• ') // 无序/任务列表
        .replace(/<[^>\n]+>/g, '')                                 // 内嵌 HTML 标签
        .replace(/\\([\\`*_[\]{}()#+\-.!>~|])/g, '$1')            // Markdown 转义字符
        .replace(/\n{3,}/g, '\n\n')
        .trim();

      value = value.replace(/\u0000ZMF(\d+)\u0000/g, function (match, index) {
        return stored[Number(index)];
      });
      A.value = value;
      count();
      flashButton(plainTextButton, '已转纯文本');
    }

    function trimOuterBlankLines(value) {
      // 只移除首尾“空行”（可含普通空格或 Tab），不会破坏第一/最后一行正文原有的缩进。
      // 不能用 value.trim()，否则第一/最后一行代码本身的前导/尾随空格也会被错误删除。
      var lines = value.split('\n');
      while (lines.length && /^[ \t]*$/.test(lines[0])) lines.shift();
      while (lines.length && /^[ \t]*$/.test(lines[lines.length - 1])) lines.pop();
      return lines.join('\n');
    }

    function cleanFences() {
      if (!A.value) {
        flashButton(cleanButton, '无内容');
        return;
      }
      var cleaned = A.value
        .replace(/\r\n?/g, '\n')
        .replace(/^[ \t]*```[^\n]*\n/gm, '')
